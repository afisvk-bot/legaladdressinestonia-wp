name: Deploy → staging

# Пуш в ветку staging = выкладка на https://staging.dragonslots-gr.gr/
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: |
          find wp-content -name '*.php' -print0 | xargs -0 -r -n1 php -l > /dev/null

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync wp-content
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
        run: |
          trap 'echo "::error::Rsync step failed at: $BASH_COMMAND (rc=$?)"' ERR
          for v in SSH_HOST SSH_USER DEPLOY_PATH; do
            [ -n "${!v}" ] || { echo "::error::Secret for $v is empty (check environment 'staging' secrets)"; exit 1; }
          done
          grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/deploy_key \
            || { echo "::error::SSH_PRIVATE_KEY is empty or not a full private key (need BEGIN/END lines)"; exit 1; }
          echo "::notice::Deploy target $SSH_USER@$SSH_HOST:$SSH_PORT -> $DEPLOY_PATH"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o ConnectTimeout=20"
          set +e
          out=$(ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "test -f '$DEPLOY_PATH/wp-config.php' && echo WP_OK" 2>&1); rc=$?
          set -e
          if [ $rc -ne 0 ] || ! echo "$out" | grep -q WP_OK; then
            echo "::error::SSH check failed (rc=$rc): $(echo "$out" | tail -3 | tr '\n' ' ')"
            if [ $rc -eq 1 ]; then
              diag=$(ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" 'echo "home=$HOME"; ls -1 "$HOME" | tr "\n" " "; test -f "$HOME/public_html/wp-config.php" && echo " | wp-config found in HOME/public_html"' 2>&1 | tr '\n' ' ')
              echo "::error::SSH login OK, but wp-config.php not found in STAGING_PATH (length ${#DEPLOY_PATH}, last char '${DEPLOY_PATH: -1}'). Server: $diag"
            fi
            exit 1
          fi
          # Без --delete: плагины, установленные через админку, не трогаем.
          # mu-plugins синхронизируем строго (это наш код).
          RSYNC_SSH="ssh $SSH_OPTS"
          rsync -az --exclude='.gitkeep' -e "$RSYNC_SSH" \
            wp-content/themes/  "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/wp-content/themes/"
          rsync -az --exclude='.gitkeep' -e "$RSYNC_SSH" \
            wp-content/plugins/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/wp-content/plugins/"
          rsync -az --delete --exclude='.gitkeep' -e "$RSYNC_SSH" \
            wp-content/mu-plugins/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/wp-content/mu-plugins/"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://staging.dragonslots-gr.gr/robots.txt || true)
          echo "robots.txt HTTP $code (401 = закрыто паролем, это нормально)"
          echo "::notice::robots.txt HTTP $code"
          [ "$code" = "200" ] || [ "$code" = "401" ] || { echo "::error::Smoke test: robots.txt HTTP $code"; exit 1; }

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
