name: Screenshot staging

# Скриншоты страниц staging (весь экран или элемент по селектору).
# Результат коммитится в ветку wp-output: out/shots-<run_id>/
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL через пробел; можно name=URL"
        required: true
      selector:
        description: "CSS-селектор элемента (пусто — первый экран)"
        required: false
        default: ""
      width:
        description: "Ширина окна"
        required: false
        default: "1440"
      clicks:
        description: "Селекторы для клика перед снимком, через ' >> ' (например #btnContact >> .mm-tabs button:nth-child(2))"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm i -s playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Take screenshots
        env:
          URLS: ${{ inputs.urls }}
          SELECTOR: ${{ inputs.selector }}
          WIDTH: ${{ inputs.width }}
          CLICKS: ${{ inputs.clicks }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/shots"
          cat > /tmp/pw/shot.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const out = process.argv[2];
            const urls = process.env.URLS.trim().split(/\s+/);
            const sel = process.env.SELECTOR;
            const width = parseInt(process.env.WIDTH || '1440', 10);
            const browser = await chromium.launch();
            const mobile = width < 768;
            const page = await browser.newPage({ viewport: { width, height: mobile ? 844 : 1000 }, deviceScaleFactor: mobile ? 2 : 1, isMobile: mobile, hasTouch: mobile });
            const clicks = (process.env.CLICKS || '').split('>>').map(s => s.trim()).filter(Boolean);
            let n = 0;
            const fs = require('fs');
            let logs = [];
            page.on('console', m => { if (['error','warning'].includes(m.type())) logs.push('console.' + m.type() + ': ' + m.text()); });
            page.on('pageerror', e => logs.push('pageerror: ' + e.message));
            for (const item of urls) {
              n++;
              const [name, url] = item.includes('=http') ? [item.slice(0, item.indexOf('=')), item.slice(item.indexOf('=') + 1)] : [String(n), item];
              logs = [];
              try {
                await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
                await page.addStyleTag({ content: '#lae-cookie-consent,[class*="lae-cookie"],[class*="cookie-consent"],[class*="cky-"],[class*="chat"],[id*="chat"],[class*="pipedrive"],iframe{display:none!important}' });
                await page.waitForTimeout(800);
                await page.evaluate(() => { window.__ev = []; ['pointerdown','touchstart','touchend','mousedown','mouseup','click'].forEach(t => document.addEventListener(t, e => { const li = document.querySelector('.mob_ready li.dropdown'); window.__ev.push(t + ':' + (e.target.className || e.target.tagName) + ':' + (li && li.classList.contains('mm-lang-open') ? 'open' : 'closed') + ':' + e.defaultPrevented); }, true)); });
                for (const c of clicks) { const el = page.locator(c).first(); try { const info = await el.evaluate(n => { const r = n.getBoundingClientRect(); const t = document.elementFromPoint(r.x + r.width / 2, r.y + r.height / 2); return JSON.stringify({ rect: [r.x, r.y, r.width, r.height], top: t ? (t.tagName + '#' + t.id + '.' + t.className) : null }); }); logs.push('target ' + c + ' ' + info); } catch (e) { logs.push('eval fail ' + e.message); } try { await el.click({ timeout: 5000 }); } catch (e) { console.log('force click', c, e.message.split('\n')[0]); await el.click({ force: true }); } await page.waitForTimeout(700); }
                const file = `${out}/${name}.png`;
                if (sel) {
                  const el = page.locator(sel).first();
                  await el.scrollIntoViewIfNeeded();
                  const b = await el.boundingBox();
                  logs.push('sel ' + JSON.stringify({ y: Math.round(b.y + (await page.evaluate(() => window.scrollY))), h: Math.round(b.height) }));
                  const pad = 60;
                  await page.screenshot({ path: file, fullPage: true, clip: { x: 0, y: Math.max(0, b.y + (await page.evaluate(() => window.scrollY)) - pad - 120), width, height: b.height + pad * 2 + 240 } });
                } else {
                  await page.screenshot({ path: file });
                }
                logs.push('events: ' + await page.evaluate(() => (window.__ev || []).join(' | ')));
                logs.push('after: ' + await page.evaluate(() => (() => { const li = document.querySelector('.mob_ready li.dropdown'); const a = li && li.querySelector('a'); const r1 = { init: !!window.laiMMInit, cls: li && li.className, aria: a && a.getAttribute('aria-expanded'), mq: matchMedia('(max-width: 991px)').matches, hash: location.hash }; if (a) a.click(); const r2 = { cls2: li && li.className, aria2: a && a.getAttribute('aria-expanded') }; return JSON.stringify(Object.assign(r1, r2)); })()));
                fs.writeFileSync(file.replace(/\.png$/, '.log'), logs.join(String.fromCharCode(10)));
                console.log('ok', name, url);
              } catch (e) { console.log('FAIL', name, url, e.message); }
            }
            await browser.close();
          })();
          EOF
          cd /tmp/pw && node shot.js "$GITHUB_WORKSPACE/shots"

      - name: Commit to wp-output
        run: |
          cd "$GITHUB_WORKSPACE"
          git init -q && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git fetch -q --depth 1 origin wp-output && git checkout -q -b wp-output FETCH_HEAD
          mkdir -p "out/shots-${GITHUB_RUN_ID}" && mv shots/* "out/shots-${GITHUB_RUN_ID}/" 2>/dev/null || true
          git add -f out && git commit -qm "screenshots ${GITHUB_RUN_ID}" && git push -q origin wp-output
